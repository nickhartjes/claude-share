packages:
  - packages/*
# Skip versions published less than a day ago (in minutes), so a compromised release has time to be
# pulled. Set here so every machine resolves the same way CI and the Docker builds do.
minimumReleaseAge: 1440
allowBuilds:
  # Downloads the Electron binary that `just dev` runs.
  electron: true
  electron-winstaller: false
  esbuild: true
  node-datachannel: true
  node-pty: true
# node-datachannel ships its native binary as per-platform optional packages. Install both macOS
# architectures so one Mac can package the arm64 and x64 apps.
supportedArchitectures:
  os: [current]
  cpu: [current, arm64, x64]

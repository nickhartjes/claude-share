# Desktop packages for macOS (dmg), Windows (nsis) and Linux (AppImage, deb).
appId: com.entrnce.specdeck
productName: SpecDeck
directories:
  output: release/${version}
files:
  - out/**
  - package.json
# The bundled Source Serif 4 font is under the SIL Open Font License, which must ship with it.
extraResources:
  - from: licenses
    to: licenses
# Native modules cannot load from inside app.asar, and node-pty's spawn-helper must be executable.
asarUnpack:
  - "**/node_modules/node-pty/**"
  - "**/node_modules/node-datachannel/**"
# node-pty and node-datachannel ship N-API prebuilds that load in Electron without rebuilding.
npmRebuild: false
afterPack: ./scripts/after-pack.cjs
# Installed apps update from this repository's GitHub Releases. release.yml creates a draft,
# uploads every platform to it, and then publishes it.
publish:
  provider: github
  owner: nickhartjes
  repo: specdeck
  releaseType: draft
fileAssociations:
  - ext: specdeck
    name: SpecDeck recording
    role: Viewer
# Installers have no version in their file name, so github.com/.../releases/latest/download/<name>
# always links to the newest one (README, Install). The updater finds files through latest*.yml.
dmg:
  artifactName: SpecDeck-${arch}.${ext}
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    # Updates on macOS install from the zip, not the dmg.
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  # Signed and notarized by the release workflow (.github/workflows/release.yml). Local and CI
  # builds set CSC_IDENTITY_AUTO_DISCOVERY=false and stay unsigned.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
win:
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  # One installer for x64 and arm64.
  artifactName: SpecDeck-Setup.${ext}
  oneClick: false
  perMachine: false
appImage:
  artifactName: SpecDeck-${arch}.${ext}
linux:
  target: [AppImage, deb]
  # Defaults to the package name, whose "@" and "/" cannot be used in a file name.
  executableName: specdeck
  category: Development
  maintainer: Entrnce
deb:
  # The default file name starts with the package name and would land in an "@specdeck/" folder.
  artifactName: specdeck_${arch}.${ext}

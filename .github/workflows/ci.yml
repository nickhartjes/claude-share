name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # Installs node, pnpm and just as pinned in mise.toml.
      - uses: jdx/mise-action@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  linux:
    name: Check (linux container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # CI pulls base images from Docker Hub; local builds use the ECR pull-through cache.
      - run: docker build -f docker/linux.Dockerfile --build-arg REGISTRY=docker.io --target check -t specdeck-linux-check .
      - run: docker run --rm specdeck-linux-check

  package:
    name: Package (${{ matrix.os }})
    needs: [check, linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: --mac }
          - { os: windows-latest, target: --win }
          - { os: ubuntu-latest, target: --linux }
    runs-on: ${{ matrix.os }}
    env:
      # CI packages are unsigned; the release workflow signs.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @specdeck/app build
      - run: pnpm --filter @specdeck/app exec electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: specdeck-${{ runner.os }}
          path: |
            packages/app/release/*/*.dmg
            packages/app/release/*/*.exe
            packages/app/release/*/*.AppImage
            packages/app/release/*/*.deb

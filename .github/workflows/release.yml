# Signed release builds, started by pushing a tag like v0.1.0.
#
# Repository secrets:
#   MAC_CERTIFICATE (base64 .p12, Developer ID Application) and MAC_CERTIFICATE_PASSWORD
#   APPLE_API_KEY (base64 .p8), APPLE_API_KEY_ID, APPLE_API_ISSUER   (notarization)
#   WIN_CERTIFICATE (base64 .pfx) and WIN_CERTIFICATE_PASSWORD
#   CLAUDE_SHARE_SIGNALLING_URL   (baked into the app as MAIN_VITE_SIGNALLING_URL)
name: Release

on:
  push:
    tags: ['v*']

jobs:
  package:
    name: Release (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: --mac }
          - { os: windows-latest, target: --win }
          - { os: ubuntu-latest, target: --linux }
    runs-on: ${{ matrix.os }}
    env:
      MAIN_VITE_SIGNALLING_URL: ${{ secrets.CLAUDE_SHARE_SIGNALLING_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @claude-share/app build
      - name: Write the notarization key
        if: runner.os == 'macOS'
        shell: bash
        run: echo "${{ secrets.APPLE_API_KEY }}" | base64 --decode > "$RUNNER_TEMP/apple-api-key.p8"
      - name: Package and sign
        shell: bash
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERTIFICATE || secrets.WIN_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERTIFICATE_PASSWORD || secrets.WIN_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          extra=""
          if [ "$RUNNER_OS" = "macOS" ]; then extra="--config.mac.notarize=true"; fi
          pnpm --filter @claude-share/app exec electron-builder ${{ matrix.target }} $extra --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: claude-share-${{ github.ref_name }}-${{ runner.os }}
          path: |
            packages/app/release/*/*.dmg
            packages/app/release/*/*.exe
            packages/app/release/*/*.AppImage
            packages/app/release/*/*.deb

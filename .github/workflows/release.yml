# Release builds, started by pushing a tag like v0.1.0 that matches packages/app/package.json.
#
# The installers and update metadata (latest*.yml) are published to this repository's GitHub
# Releases, where installed apps look for updates. The release stays a draft, which apps ignore,
# until every platform has uploaded; then it is published. Tags with a suffix (v0.2.0-rc.1) are
# published as prereleases, which only apps on a prerelease version update to.
#
# Repository secrets (signing and notarization are skipped while they are missing):
#   MAC_CERTIFICATE (base64 .p12, Developer ID Application) and MAC_CERTIFICATE_PASSWORD
#   APPLE_API_KEY (base64 .p8), APPLE_API_KEY_ID, APPLE_API_ISSUER   (notarization)
#   WIN_CERTIFICATE (base64 .pfx) and WIN_CERTIFICATE_PASSWORD
#   SPECDECK_SIGNALLING_URL   (baked into the app as MAIN_VITE_SIGNALLING_URL)
# After publishing, the `nix` job commits the new version and hash to nix/release.json on main,
# which the flake (flake.nix) packages.
#
#   HOMEBREW_TAP_TOKEN   token that can push to nickhartjes/homebrew-tap, where the `homebrew` job
#                        writes Casks/specdeck.rb (skipped while it is missing)
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  draft:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches the app version
        shell: bash
        run: |
          version="v$(node -p "require('./packages/app/package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the app version $version in packages/app/package.json"
            exit 1
          fi
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes

  package:
    name: Release (${{ matrix.os }})
    needs: draft
    strategy:
      # One platform failing should not hide whether the others build.
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: --mac }
          - { os: windows-latest, target: --win }
          - { os: ubuntu-latest, target: --linux }
    runs-on: ${{ matrix.os }}
    env:
      MAIN_VITE_SIGNALLING_URL: ${{ secrets.SPECDECK_SIGNALLING_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @specdeck/app build
      - name: Write the notarization key
        if: runner.os == 'macOS'
        shell: bash
        run: echo "${{ secrets.APPLE_API_KEY }}" | base64 --decode > "$RUNNER_TEMP/apple-api-key.p8"
      - name: Package, sign and upload to the draft
        shell: bash
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERTIFICATE || secrets.WIN_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERTIFICATE_PASSWORD || secrets.WIN_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          GH_TOKEN: ${{ github.token }}
        run: |
          extra=""
          # Unsigned until the certificates are set up (shared-claude-session task 11.2). An empty
          # CSC_LINK is read as a path, so remove it rather than leave it empty.
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$CSC_LINK" ] && [ -n "$APPLE_API_KEY_ID" ]; then extra="--config.mac.notarize=true"; fi
          pnpm --filter @specdeck/app exec electron-builder ${{ matrix.target }} $extra --publish always
      - uses: actions/upload-artifact@v4
        with:
          name: specdeck-${{ github.ref_name }}-${{ runner.os }}
          path: |
            packages/app/release/*/*.dmg
            packages/app/release/*/*.zip
            packages/app/release/*/latest*.yml
            packages/app/release/*/*.exe
            packages/app/release/*/*.AppImage
            packages/app/release/*/*.deb

  publish:
    name: Publish release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=false
          case "$GITHUB_REF_NAME" in *-*) prerelease=true ;; esac
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease="$prerelease"

  homebrew:
    name: Update Homebrew cask
    needs: publish
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Check for the tap token
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; the Homebrew cask was not updated."
          fi
      - name: Checkout tap
        if: env.TAP_TOKEN != ''
        uses: actions/checkout@v5
        with:
          repository: nickhartjes/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Render cask
        if: env.TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$TAG" -R "$REPO" -p 'SpecDeck-arm64.dmg' -p 'SpecDeck-x64.dmg' -D dmg
          SHA_ARM=$(sha256sum dmg/SpecDeck-arm64.dmg | awk '{print $1}')
          SHA_INTEL=$(sha256sum dmg/SpecDeck-x64.dmg | awk '{print $1}')
          mkdir -p tap/Casks
          cat > tap/Casks/specdeck.rb <<EOF
          cask "specdeck" do
            arch arm: "arm64", intel: "x64"

            version "${TAG#v}"
            sha256 arm:   "${SHA_ARM}",
                   intel: "${SHA_INTEL}"

            url "https://github.com/${REPO}/releases/download/v#{version}/SpecDeck-#{arch}.dmg"
            name "SpecDeck"
            desc "Share a Claude Code session with your team"
            homepage "https://github.com/${REPO}"

            livecheck do
              url :url
              strategy :github_latest
            end

            depends_on macos: ">= :monterey"

            app "SpecDeck.app"

            zap trash: [
              "~/Library/Application Support/SpecDeck",
              "~/Library/Caches/@specdeckapp-updater",
              "~/Library/Logs/SpecDeck",
              "~/Library/Preferences/com.entrnce.specdeck.plist",
              "~/Library/Saved Application State/com.entrnce.specdeck.savedState",
            ]
          end
          EOF
          cat tap/Casks/specdeck.rb
      - name: Commit and push
        if: env.TAP_TOKEN != ''
        working-directory: tap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/specdeck.rb
          if git diff --cached --quiet; then
            echo "No cask changes"
            exit 0
          fi
          git commit -m "specdeck ${TAG#v}"
          git push

  nix:
    name: Update Nix package
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Update nix/release.json
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release download "$TAG" -p SpecDeck-x86_64.AppImage -D appimage
          hash="sha256-$(openssl dgst -sha256 -binary appimage/SpecDeck-x86_64.AppImage | base64 -w0)"
          printf '{\n  "version": "%s",\n  "hash": "%s"\n}\n' "${TAG#v}" "$hash" > nix/release.json
          cat nix/release.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nix/release.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update the Nix package to ${TAG#v}"
          git push origin HEAD:main

# Signalling service and TURN relay for Claude Share. See packages/signalling/README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - signalling.yaml
  - coturn.yaml
# Shared TURN secret; create turn-secret.env (not committed) with a line TURN_SECRET=<random value>.
secretGenerator:
  - name: claude-share-turn
    envs:
      - turn-secret.env
configMapGenerator:
  - name: claude-share-network
    literals:
      # Public address of the TURN service, as coturn should advertise it.
      - TURN_EXTERNAL_IP=203.0.113.10
      # TURN URLs as apps reach them (comma-separated).
      - TURN_URLS=turn:turn.example.com:3478?transport=udp,turn:turn.example.com:3478?transport=tcp
      - STUN_URLS=stun:turn.example.com:3478
